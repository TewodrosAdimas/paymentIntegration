<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Payment App{% endblock %}</title>
    <!-- Add links to CSS frameworks (Bootstrap, Tailwind, etc.) or your own CSS here -->
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="number"], input[type="tel"] { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .alert { padding: 15px; margin-bottom: 20px; border: 1px solid transparent; border-radius: 4px; }
        .alert-success { color: #155724; background-color: #d4edda; border-color: #c3e6cb; }
        .alert-danger { color: #721c24; background-color: #f8d7da; border-color: #f5c6cb; }
        .alert-info { color: #0c5460; background-color: #d1ecf1; border-color: #bee5eb; }
        dl { margin-top: 15px; }
        dt { font-weight: bold; }
        dd { margin-left: 20px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% block page_title %}{% endblock %}</h1>
        <hr>
        {% block content %}
        <!-- Specific page content will go here -->
        {% endblock %}
    </div>
</body>
</html>
